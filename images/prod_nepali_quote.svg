<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad2)" />

  <!-- T-shirt Body (Dark Navy / Black) -->
  <g filter="url(#shadow2)">
    <path d="M 190 120 C 230 155 370 155 410 120 L 530 190 L 470 290 L 415 255 L 415 500 C 415 515 400 520 380 520 L 220 520 C 200 520 185 515 185 500 L 185 255 L 130 290 L 70 190 Z" 
          fill="#0F172A" stroke="#1E293B" stroke-width="2.5" />
    
    <!-- Collar -->
    <path d="M 190 120 C 230 155 370 155 410 120 C 360 175 240 175 190 120 Z" fill="#1E293B" stroke="#334155" stroke-width="2" />
    <path d="M 230 125 C 265 145 335 145 370 125 C 340 110 260 110 230 125 Z" fill="#090D16" />
  </g>

  <!-- Nepali Quote Typography Artwork on Chest -->
  <g transform="translate(300, 240)">
    <!-- Mountain Silhouette Graphic -->
    <path d="M -80 0 L -30 -35 L 0 -15 L 40 -45 L 80 0 Z" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="-30,-35 -40,-20 -20,-20" fill="#FFFFFF" />
    <polygon points="40,-45 28,-28 52,-28" fill="#FFFFFF" />

    <!-- Nepali Script Lines -->
    <text x="0" y="45" font-family="'Plus Jakarta Sans', 'Mukta', 'Noto Sans Devanagari', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      नेपाली मन, नेपाली शान
    </text>
    
    <text x="0" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#E63946" text-anchor="middle" letter-spacing="3">
      • BORN IN NEPAL 🇳🇵 •
    </text>
    
    <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="12" fill="#94A3B8" text-anchor="middle" letter-spacing="1">
      ORIGINAL HIMALAYAN STREETWEAR
    </text>

    <!-- Ornamental Flourish -->
    <line x1="-70" y1="125" x2="70" y2="125" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" />
    <circle cx="0" cy="125" r="4" fill="#E63946" />
  </g>

  <!-- Product Badge -->
  <rect x="30" y="30" width="135" height="32" rx="16" fill="#E63946" />
  <text x="97" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    🇳🇵 NEPALI QUOTE
  </text>
</svg>
