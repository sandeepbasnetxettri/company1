<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad3)" />

  <!-- T-shirt Body (Royal Navy Blue) -->
  <g filter="url(#shadow3)">
    <path d="M 190 120 C 230 155 370 155 410 120 L 530 190 L 470 290 L 415 255 L 415 500 C 415 515 400 520 380 520 L 220 520 C 200 520 185 515 185 500 L 185 255 L 130 290 L 70 190 Z" 
          fill="#1E3A8A" stroke="#172554" stroke-width="2.5" />
    
    <!-- Collar -->
    <path d="M 190 120 C 230 155 370 155 410 120 C 360 175 240 175 190 120 Z" fill="#172554" stroke="#0F172A" stroke-width="2" />
    <path d="M 230 125 C 265 145 335 145 370 125 C 340 110 260 110 230 125 Z" fill="#0C1322" />

    <!-- Sleeve Sport Stripes -->
    <line x1="88" y1="210" x2="148" y2="305" stroke="#F59E0B" stroke-width="6" />
    <line x1="512" y1="210" x2="452" y2="305" stroke="#F59E0B" stroke-width="6" />
  </g>

  <!-- Team / Event Logo Graphics -->
  <g transform="translate(300, 240)">
    <!-- Crest Shield Badge -->
    <path d="M -40 -10 L 40 -10 C 40 30 0 65 0 65 C 0 65 -40 30 -40 -10 Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
    <text x="0" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="20" fill="#0F172A" text-anchor="middle">
      SKB
    </text>

    <!-- Team / Company Event Typography -->
    <text x="0" y="105" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      DUMKIBAS HEROES
    </text>
    <text x="0" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#93C5FD" text-anchor="middle" letter-spacing="3">
      EVENT &amp; TOURNAMENT 2026
    </text>
    <text x="0" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="32" fill="#F59E0B" text-anchor="middle">
      #07
    </text>
  </g>

  <!-- Product Badge -->
  <rect x="30" y="30" width="135" height="32" rx="16" fill="#1E3A8A" />
  <text x="97" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    🏆 TEAM / EVENT
  </text>
</svg>
