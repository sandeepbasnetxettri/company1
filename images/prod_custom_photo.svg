<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- T-shirt Body -->
  <g filter="url(#shadow)">
    <!-- Main Shirt Path (White Premium Tee) -->
    <path d="M 190 120 C 230 155 370 155 410 120 L 530 190 L 470 290 L 415 255 L 415 500 C 415 515 400 520 380 520 L 220 520 C 200 520 185 515 185 500 L 185 255 L 130 290 L 70 190 Z" 
          fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" />
    
    <!-- Collar -->
    <path d="M 190 120 C 230 155 370 155 410 120 C 360 175 240 175 190 120 Z" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" />
    <!-- Collar Inner Shadow -->
    <path d="M 230 125 C 265 145 335 145 370 125 C 340 110 260 110 230 125 Z" fill="#E2E8F0" />
    
    <!-- Subtle Creases / Seams -->
    <path d="M 185 255 L 210 290 M 415 255 L 390 290" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Photo Print Polaroid Effect on Shirt -->
  <g transform="translate(210, 200)">
    <!-- Polaroid White Frame with drop shadow on fabric -->
    <rect x="0" y="0" width="180" height="215" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#shadow)" />
    
    <!-- Photo Image Area -->
    <rect x="15" y="15" width="150" height="145" rx="4" fill="url(#photoGrad)" />
    
    <!-- Silhouette inside photo (Portrait / Memory) -->
    <circle cx="90" cy="65" r="28" fill="#FFFFFF" opacity="0.9" />
    <path d="M 50 140 C 50 100 130 100 130 140 Z" fill="#FFFFFF" opacity="0.9" />
    <circle cx="130" cy="40" r="8" fill="#FEF08A" />
    
    <!-- Camera Badge / Overlay -->
    <circle cx="90" cy="85" r="14" fill="#0F172A" opacity="0.3" />
    
    <!-- Polaroid Caption Text -->
    <text x="90" y="182" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#1E293B" text-anchor="middle" letter-spacing="0.5">
      YOUR MEMORIES ❤️
    </text>
    <text x="90" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="9" fill="#64748B" text-anchor="middle">
      Ultra-HD DTF Print • Dumkibas
    </text>
  </g>

  <!-- Product Badge -->
  <rect x="30" y="30" width="140" height="32" rx="16" fill="#0F172A" />
  <text x="100" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
    📸 CUSTOM PHOTO
  </text>
</svg>
